name: CI/CD Pipeline Aplikasi Kampus

on:
  push:
    branches: [ main ]

jobs:
  kualitas-dan-keamanan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      - name: Automated Unit Testing
        run: echo "Menjalankan unit testing... Sukses!"
      - name: Static Code Analysis
        run: echo "Menjalankan SonarQube Scan... Sukses!"
      - name: Vulnerability Scan
        run: echo "Menjalankan Trivy Security Scan... Sukses!"

  pembungkusan-dan-rilis:
    needs: kualitas-dan-keamanan
    runs-on: ubuntu-latest
    steps:
      - name: Build Docker Image
        run: echo "Membangun Docker Image kampus-app... Sukses!"
      - name: Push Docker Image
        run: echo "Mengirim Image ke Container Registry... Sukses!"

  penyebaran-produksi:
    needs: pembungkusan-dan-rilis
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via Helm
        run: echo "Menyebarkan aplikasi ke produksi dengan Helm... Sukses!"
